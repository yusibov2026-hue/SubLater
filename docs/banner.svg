<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="SubLyter — High-Speed AI Subtitles, 53-Language Translation &amp; Material You Video Studio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="55%" stop-color="#131722"/>
      <stop offset="100%" stop-color="#181d2c"/>
    </linearGradient>

    <radialGradient id="auroraBlue" cx="22%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#1b8ef2" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1b8ef2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1b8ef2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraViolet" cx="84%" cy="68%" r="48%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b8ef2"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2436" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#141824" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.11"/>
    </pattern>
  </defs>

  <!-- Base Tonal Canvas -->
  <rect width="1280" height="420" rx="28" fill="url(#bgGrad)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dotGrid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#auroraBlue)"/>
  <rect width="1280" height="420" rx="28" fill="url(#auroraViolet)"/>

  <!-- Atmospheric Snowfall / Particles -->
  <g fill="#dbeafe" fill-opacity="0.38">
    <circle cx="94" cy="64" r="2.2"/>
    <circle cx="218" cy="48" r="1.5"/>
    <circle cx="446" cy="74" r="2.0"/>
    <circle cx="590" cy="44" r="1.4"/>
    <circle cx="670" cy="96" r="2.4"/>
    <circle cx="118" cy="360" r="1.8"/>
    <circle cx="388" cy="378" r="2.2"/>
    <circle cx="540" cy="356" r="1.6"/>
    <circle cx="722" cy="372" r="2.1"/>
    <circle cx="1210" cy="58" r="2.3"/>
    <circle cx="1165" cy="374" r="1.9"/>
  </g>

  <!-- Subtle Wave Accent -->
  <path d="M 0 342 C 210 296, 420 392, 650 340 C 875 289, 1080 374, 1280 326 L 1280 420 L 0 420 Z" fill="#1b8ef2" fill-opacity="0.06"/>

  <!-- Left Hero Brand + Headline -->
  <g transform="translate(56, 56)">
    <!-- Play + Subtitle Speed Glyph -->
    <rect x="0" y="0" width="68" height="68" rx="20" fill="#182235" stroke="#60a5fa" stroke-opacity="0.38" stroke-width="1.5"/>
    <polygon points="18,19 18,49 41,34" fill="none" stroke="#1b8ef2" stroke-width="4" stroke-linejoin="round"/>
    <rect x="37" y="21" width="17" height="4.5" rx="2.25" fill="#93c5fd"/>
    <rect x="43" y="31.5" width="13" height="4.5" rx="2.25" fill="#f8fafc"/>
    <rect x="37" y="42" width="17" height="4.5" rx="2.25" fill="#93c5fd"/>

    <!-- Title + Version Pill -->
    <text x="86" y="37" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">SubLyter</text>
    <rect x="278" y="13" width="76" height="26" rx="13" fill="#1b8ef2" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1"/>
    <text x="316" y="30" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">v1.0.79</text>

    <text x="86" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500">Android AI Subtitle Studio · Material You (M3)</text>

    <!-- Main Headline -->
    <text x="0" y="128" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700">Ultra-Fast Subtitles Powered by Groq,</text>
    <text x="0" y="160" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700">53-Lang Translation &amp; Gemini Q&amp;A</text>

    <text x="0" y="198" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">
      Built on Groq LPU™ — one of the world's fastest AI inference engines —
    </text>
    <text x="0" y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">
      paired with 4× native 16 kHz audio, multi-key rotation &amp; rich Material You.
    </text>

    <!-- Feature Pill Row -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="176" height="34" rx="17" fill="url(#accentPill)"/>
      <text x="88" y="21.5" text-anchor="middle" fill="#061224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Powered by Groq LPU™</text>

      <rect x="188" y="0" width="166" height="34" rx="17" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1"/>
      <text x="271" y="21.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">4× Parallel Audio</text>

      <rect x="366" y="0" width="174" height="34" rx="17" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
      <text x="453" y="21.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Rich Material You (M3)</text>
    </g>
  </g>

  <!-- Right Tech Pipeline Architecture Card -->
  <g transform="translate(690, 44)">
    <rect x="0" y="0" width="534" height="332" rx="24" fill="url(#cardSurface)" stroke="url(#cardStroke)" stroke-width="1.5"/>

    <!-- Card Header -->
    <text x="26" y="34" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.2">HIGH-THROUGHPUT PIPELINE</text>
    <circle cx="482" cy="29" r="4.5" fill="#22c55e"/>
    <text x="494" y="33.5" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">LIVE</text>

    <!-- Stage 1 -->
    <rect x="24" y="54" width="486" height="56" rx="14" fill="#111622" stroke="#334155" stroke-width="1"/>
    <rect x="36" y="68" width="28" height="28" rx="8" fill="#1b8ef2" fill-opacity="0.2"/>
    <text x="50" y="87" text-anchor="middle" fill="#60a5fa" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">01</text>
    <text x="76" y="79" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Media3 + 4-Thread Audio / Embedded Sub Extractor</text>
    <text x="76" y="98" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">16 kHz mono WAV · StreamAudioCaptureSink · session chunks</text>

    <!-- Connector -->
    <line x1="267" y1="110" x2="267" y2="124" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Stage 2 -->
    <rect x="24" y="124" width="486" height="56" rx="14" fill="#111622" stroke="#334155" stroke-width="1"/>
    <rect x="36" y="138" width="28" height="28" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="50" y="157" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">02</text>
    <text x="76" y="149" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Groq LPU™ Hyper-Fast Whisper + Streaming LLM</text>
    <text x="76" y="168" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">whisper-large-v3-turbo · GPT-OSS 120B/20B · 401/429 KeyPool</text>

    <!-- Connector -->
    <line x1="267" y1="180" x2="267" y2="194" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Stage 3 -->
    <rect x="24" y="194" width="486" height="56" rx="14" fill="#111622" stroke="#334155" stroke-width="1"/>
    <rect x="36" y="208" width="28" height="28" rx="8" fill="#a78bfa" fill-opacity="0.2"/>
    <text x="50" y="227" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">03</text>
    <text x="76" y="219" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">O(W+S) Word Alignment &amp; Gemini Multimodal Q&amp;A</text>
    <text x="76" y="238" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="11.5">Binary-search cue sync · Frame capture · VTT/SRT/ASS/TXT</text>

    <!-- Bottom Metrics Strip -->
    <g transform="translate(24, 266)">
      <rect x="0" y="0" width="114" height="46" rx="12" fill="#172033" stroke="#1b8ef2" stroke-opacity="0.3" stroke-width="1"/>
      <text x="57" y="21" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">53</text>
      <text x="57" y="37" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">Languages</text>

      <rect x="124" y="0" width="114" height="46" rx="12" fill="#172033" stroke="#1b8ef2" stroke-opacity="0.3" stroke-width="1"/>
      <text x="181" y="21" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">30</text>
      <text x="181" y="37" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">GPU Wallpapers</text>

      <rect x="248" y="0" width="114" height="46" rx="12" fill="#172033" stroke="#1b8ef2" stroke-opacity="0.3" stroke-width="1"/>
      <text x="305" y="21" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">24</text>
      <text x="305" y="37" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">Offline Fonts</text>

      <rect x="372" y="0" width="114" height="46" rx="12" fill="#172033" stroke="#1b8ef2" stroke-opacity="0.3" stroke-width="1"/>
      <text x="429" y="21" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">200%</text>
      <text x="429" y="37" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5">Audio Boost</text>
    </g>
  </g>
</svg>
